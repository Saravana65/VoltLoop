server.port=8080

# ==============================================================================
# VoltNexus JDBC Database Configuration
# Uses environment variables with sensible defaults for local development
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:voltnexus}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:voltnexus_user}
spring.datasource.password=${DB_PASSWORD:voltnexus_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Logging Level - Useful for viva demonstrations to view PreparedStatement SQL execution
logging.level.com.voltnexus=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
